<style>

lign-items:end;border-radius:5px;overflow:hidden;margin-bottom:5px}.bar i{width:100%;display:block;border-radius:5px}.bar-col.today-col{color:var(--orange);font-weight:700}.label{font-size:12px;letter-spacing:.04em;color:var(--dim);margin:18px 2px 9px}.log{display:flex;overflow:hidden;margin-bottom:9px;cursor:pointer}.tick{width:5px;flex:none}.tick.full{background:var(--orange)}.tick.half{background:var(--yellow)}.tick.rest{background:var(--rest)}.logbody{padding:14px;flex:1;min-width:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.date{font-weight:700;font-size:14px}.badge,.chip{font-size:11px;padding:4px 9px}.badge{border-radius:999px}.badge.full{background:var(--orange2);color:var(--orange)}.badge.half{background:var(--yellow2);color:var(--yellow)}.badge.rest{background:var(--rest2);color:#a7b2a4}.badge.empty{background:rgba(255,255,255,.06);color:var(--dim)}.desc{font-size:13px;margin:8px 0;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border-radius:8px;background:rgba(255,255,255,.07);color:var(--ink)}.expense{font-size:12px;color:var(--green);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}.empty-state{text-align:center;padding:35px 15px;color:var(--dim);font-size:13px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{padding:15px;cursor:pointer}.person .num{font-size:28px;font-weight:800;margin-top:12px}.person .num span{font-size:12px;color:var(--dim);font-weight:500}.person .paid{font-size:11px;color:var(--green);margin-top:4px}.person.selected{border-color:rgba(255,122,26,.55);box-shadow:0 0 0 1px rgba(255,122,26,.12)}.person.archived{opacity:.68}.detail{padding:16px;margin-top:12px}.detail h3{margin:0;font-size:16px}.detail .big{font-size:36px;color:var(--orange);font-weight:800;margin:14px 0 2px}.detail .big span{font-size:13px;color:var(--dim)}.detail-line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.detail-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:9px;margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;font-size:13px;cursor:pointer}.btn.primary{background:var(--orange);color:#1c1004;flex:1}.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink)}.btn.danger{background:var(--red2);color:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}.history{margin-top:16px}.history-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.history-item b{color:var(--green);white-space:nowrap}.manage{padding:16px;margin-bottom:12px}.manage-head{display:flex;justify-content:space-between;align-items:center}.manage-head h3{margin:0;font-size:15px}.count{font-size:12px;color:var(--orange);background:var(--orange2);padding:5px 9px;border-radius:999px}.adder{display:flex;gap:8px;margin:14px 0}.adder input{flex:1;min-width:0;background:#12100d;border:1px solid var(--line);color:var(--ink);padding:11px;border-radius:10px;outline:none}.adder button{background:var(--orange);border:0;border-radius:10px;padding:0 15px;font-weight:800}.manage-item{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 2px;font-size:13px}.del{border:0;background:var(--red2);color:var(--red);width:29px;height:29px;border-radius:8px}.limit{display:none;background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.28);color:#ef9696;font-size:12px;line-height:1.5;padding:10px;border-radius:10px;margin-bottom:10px}.limit.show{display:block}.notice{background:var(--orange2);border:1px solid rgba(255,122,26,.25);color:#e7b07f;font-size:12px;line-height:1.55;padding:11px;border-radius:11px;margin-bottom:12px}.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:calc(50% + 170px);width:56px;height:56px;border:0;border-radius:50%;background:var(--orange);font-size:27px;color:#211205;box-shadow:0 10px 28px rgba(255,122,26,.38);z-index:5}@media(max-width:480px){.fab{left:auto;right:20px}.adder input,.date-input,.purchase-row input{font-size:16px}}.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:10;align-items:flex-end}.backdrop.on{display:flex}.sheet{width:min(100%,480px);max-height:91vh;overflow:auto;-webkit-overflow-scrolling:touch;margin:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 20px calc(28px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet-head h3{margin:0;font-size:16px}.close{border:0;background:transparent;color:var(--dim);padding:6px}.field-label{display:block;font-size:11.5px;color:var(--dim);margin:16px 0 7px}.date-input{width:100%;padding:11px;border-radius:10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);color-scheme:dark}.type-row{display:flex;gap:8px}.type-btn{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--dim)}.type-btn.on.full{background:var(--orange2);color:var(--orange);border-color:var(--orange)}.type-btn.on.half{background:var(--yellow2);color:var(--yellow);border-color:var(--yellow)}.type-btn.on.rest{background:var(--rest2);color:#a7b2a4;border-color:var(--rest)}.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-top:9px;font-size:13px}.switch{width:42px;height:24px;border:0;border-radius:999px;background:rgba(255,255,255,.13);position:relative}.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:white;left:2px;top:2px;transition:.15s}.switch.on{background:var(--orange)}.switch.on:after{left:20px}.switch:disabled{opacity:.4}.choice-wrap{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);padding:7px 10px;border-radius:9px;font-size:12px}.choice.on{background:var(--orange2);border-color:rgba(255,122,26,.5);color:var(--orange)}.worker-day-list{display:grid;gap:8px}.worker-day-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.worker-day-row>span{font-size:12px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.day-pills{display:flex;gap:5px}.day-pill{border:1px solid var(--line);background:#12100d;color:var(--dim);border-radius:8px;padding:6px 8px;font-size:11px}.day-pill.on{background:var(--orange2);border-color:rgba(255,122,26,.5);color:var(--orange)}.worker-day-help{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:7px}.purchase-row{display:grid;grid-template-columns:1.3fr 1fr 32px;gap:7px;margin-bottom:7px}.purchase-row input{min-width:0;background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:9px;border-radius:9px}.remove-expense{border:0;background:var(--red2);color:var(--red);border-radius:8px}.mini-add{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);padding:7px 10px;border-radius:8px;font-size:12px}.sheet-actions{display:flex;gap:9px;margin-top:20px}.dialog-wrap{align-items:center;padding:24px}.dialog{width:min(100%,400px);margin:auto;background:var(--paper2);border:1px solid var(--line);border-radius:18px;padding:20px}.dialog h3{margin:0 0 8px}.dialog p{font-size:13px;color:var(--dim);line-height:1.6}.dialog strong{color:var(--orange)}.settle-preview{margin-top:12px;padding:13px;border:1px solid rgba(255,122,26,.24);border-radius:12px;background:rgba(255,122,26,.08)}.settle-preview>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.settle-preview span{font-size:12px;color:var(--dim)}.settle-preview strong{font-size:24px}.settle-preview small{display:block;margin-top:6px;color:var(--dim);font-size:11px;line-height:1.45}.settle-preview .remaining{color:var(--green)}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,18px);background:#352f27;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><main class="app">
<header class="top"><div><h1>工作日志</h1><div class="sub">按日期记录 · 每人独立核算</div></div><div class="logo">工</div></header>
<nav class="tabs"><button class="tab on" data-view="logs">日志</button><button class="tab" data-view="people">人员</button><button class="tab" data-view="manage">管理</button></nav>
<section id="logs" class="view on"><div class="week"><button class="round" id="prevWeek">‹</button><div class="week-center"><span id="weekLabel"></span><button class="today" id="todayBtn">今天</button></div><button class="round" id="nextWeek">›</button></div><div class="summary"><div class="sumtop"><div><div class="muted" style="font-size:12px">本周合计</div><strong id="weekTotal">0<small> 天</small></strong></div><span class="badge full">出勤</span></div><div class="bars" id="bars"></div></div><div class="label" id="dateRange"></div><div id="entries"></div></section>
<section id="people" class="view"><div class="label">当前未结算 · 点击人员查看明细</div><div class="people" id="peopleGrid"></div><div id="personDetail"></div></section>
<section id="manage" class="view"><div id="migrationNotice"></div><div class="panel manage"><div class="manage-head"><h3>工作人员</h3><span class="count" id="workerCount"></span></div><div class="adder"><input id="workerInput" maxlength="20" placeholder="输入工作人员姓名"><button data-add="worker">添加</button></div><div class="limit" id="workerLimit">工作人员最多保存 12 人，请先删除一位工作人员后再添加。</div><div id="workerList"></div></div><div class="panel manage"><div class="manage-head"><h3>工作内容</h3><span class="count" id="taskCount"></span></div><div class="adder"><input id="taskInput" maxlength="30" placeholder="输入工作内容"><button data-add="task">添加</button></div><div class="limit" id="taskLimit">工作内容最多保存 12 种，请先删除一种后再添加。</div><div id="taskList"></div></div></section>
<button class="fab" id="fab" aria-label="新增今日记录">＋</button></main>

<div class="backdrop" id="editor"><div class="sheet"><div class="sheet-head"><h3 id="editorTitle">新增记录</h3><button class="close" data-close="editor">关闭</button></div><div class="field-label">日期</div><input class="date-input" type="date" id="entryDate"><div class="field-label">当天默认出勤</div><div class="type-row" id="typeRow"><button class="type-btn full" data-type="full">整天</button><button class="type-btn half" data-type="half">半天</button><button class="type-btn rest" data-type="rest">休息</button></div><div class="toggle"><span>当天默认加班（额外 +0.5 天）</span><button class="switch" id="overtime" aria-label="加班开关"></button></div><div class="field-label">工作内容</div><div class="choice-wrap" id="taskChoices"></div><div class="field-label">工作人员</div><div class="choice-wrap" id="workerChoices"></div><div class="field-label">每个人的出勤天数</div><div class="worker-day-help">选中工作人员后可单独调整；不调整时跟随当天默认出勤。</div><div class="worker-day-list" id="workerDayRows"></div><div class="field-label">买饭 / 买材料 / 其他花销</div><div id="purchaseRows"></div><div style="display:flex;gap:7px"><button class="mini-add" data-expense="买饭">＋ 买饭</button><button class="mini-add" data-expense="买材料">＋ 买材料</button><button class="mini-add" data-expense="">＋ 其他</button></div><div class="sheet-actions"><button class="btn danger" id="deleteEntry">删除</button><button class="btn primary" id="saveEntry">保存</button></div></div></div>
<div class="backdrop dialog-wrap" id="settleDialog"><div class="dialog"><h3>选择工资结算日期</h3><p>为 <strong id="settleName"></strong> 选择结算截止日期。只结清该日期及之前仍未结算的工作，之后的记录会继续保留并累计。</p><label class="field-label" for="settleDate">结算到哪一天</label><input class="date-input" type="date" id="settleDate"><div class="settle-preview"><div><span>本次结算</span><strong id="settleDays">0 天</strong></div><small id="settleRange">请选择结算日期</small><small class="remaining" id="settleRemaining"></small></div><div class="actions"><button class="btn ghost" data-close="settleDialog">取消</button><button class="btn primary" id="confirmSettle">确认结清</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){'use strict';
const ENTRY_KEY='worklog_entries_v1',META_KEY='worklog_meta_v2';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{let x=new Date(d),w=x.getDay();return addDays(x,w===0?-6:1-w)};
const md=d=>(d.getMonth()+1)+'月'+d.getDate()+'日';
const short=d=>(d.getMonth()+1)+'/'+d.getDate();
const weekday=d=>'日一二三四五六'[d.getDay()];
const num=n=>(Math.round(n*10)/10).toString();
const now=()=>new Date().toISOString();
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}};
let storageError=false;
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageError=true;return false}};
let entries=load(ENTRY_KEY,{}),meta=load(META_KEY,null),migrated=false;
function uniq(list){return [...new Set(list.map(x=>String(x).trim()).filter(Boolean))]}
function migrate(){
  if(!meta){let vals=Object.values(entries);meta={version:4,workers:uniq(vals.flatMap(e=>e.workers||[])).map(name=>({name,active:true,createdAt:now()})),tasks:uniq(vals.flatMap(e=>e.contents||[])).map(name=>({name,active:true,createdAt:now()})),settlements:[]};migrated=Object.keys(entries).length>0;save(META_KEY,meta)}
  meta.version=4;meta.workers=Array.isArray(meta.workers)?meta.workers:[];meta.tasks=Array.isArray(meta.tasks)?meta.tasks:[];meta.settlements=Array.isArray(meta.settlements)?meta.settlements:[];
  meta.workers=meta.workers.map(x=>typeof x==='string'?{name:x,active:true,createdAt:now()}:{...x,active:x.active!==false});meta.tasks=meta.tasks.map(x=>typeof x==='string'?{name:x,active:true,createdAt:now()}:{...x,active:x.active!==false});save(META_KEY,meta)
}migrate();
let photoImported=0,photoSkipped=0;
function importPhotoRecords(){
  const importId='photo_2026-08-17_2026-08-22_v1';
  meta.imports=Array.isArray(meta.imports)?meta.imports:[];
  if(meta.imports.includes(importId))return;
  const photoEntries={
    '2026-08-17':{type:'full',overtime:false,contents:['4560 干活'],workers:['我','大姐','毕师傅'],purchases:[]},
    '2026-08-18':{type:'full',overtime:false,contents:['4560 干活','亨德森收尾'],workers:['我','斯哥','大姐','长征','毕师傅'],purchases:[]},
    '2026-08-19':{type:'full',overtime:false,contents:['4560 干活'],workers:['我','长征'],purchases:[]},
    '2026-08-20':{type:'full',overtime:false,contents:['4560 干活','亨德森收尾'],workers:['我','长征','毕师傅'],purchases:[{label:'我全天没上课',amount:20}]},
    '2026-08-21':{type:'full',overtime:false,contents:['4560 干活'],workers:['我','长征','毕师傅'],purchases:[]},
    '2026-08-22':{type:'full',overtime:false,contents:['4560 干活'],workers:['我','长征','毕师傅'],purchases:[]}
  };
  Object.entries(photoEntries).forEach(([date,entry])=>{
    if(entries[date])photoSkipped++;
    else{entries[date]=entry;photoImported++}
  });
  const workerNames=uniq(Object.values(photoEntries).flatMap(e=>e.workers));
  const taskNames=uniq(Object.values(photoEntries).flatMap(e=>e.contents));
  workerNames.forEach(name=>{
    let existing=meta.workers.find(x=>x.name===name);
    if(existing&&existing.active===false&&meta.workers.filter(x=>x.active).length<12)existing.active=true;
    else if(!existing&&meta.workers.filter(x=>x.active).length<12)meta.workers.push({name,active:true,createdAt:now()});
  });
  taskNames.forEach(name=>{
    let existing=meta.tasks.find(x=>x.name===name);
    if(existing&&existing.active===false&&meta.tasks.filter(x=>x.active).length<12)existing.active=true;
    else if(!existing&&meta.tasks.filter(x=>x.active).length<12)meta.tasks.push({name,active:true,createdAt:now()});
  });
  meta.imports.push(importId);
  save(ENTRY_KEY,entries);save(META_KEY,meta);
}
importPhotoRecords();
let baselineAdjusted=false;
function applyTargetDayBaselines(){
  const adjustmentId='baseline_2026-08-17_me6_changzheng5_v1';
  meta.adjustments=Array.isArray(meta.adjustments)?meta.adjustments:[];
  meta.dayBaselines={...(meta.dayBaselines||{}),'我':'2026-08-17','长征':'2026-08-17'};
  if(!meta.adjustments.includes(adjustmentId)){
    meta.adjustments.push(adjustmentId);
    baselineAdjusted=true;
  }
  save(META_KEY,meta);
}
applyTargetDayBaselines();
function persist(){let a=save(ENTRY_KEY,entries),b=save(META_KEY,meta);if(!a||!b){toast('保存失败：请检查浏览器存储权限或空间');return false}return true}
function activeWorkers(){return meta.workers.filter(x=>x.active)}function activeTasks(){return meta.tasks.filter(x=>x.active)}
function dayCount(e){if(!e||e.type==='rest')return 0;return (e.type==='full'?1:e.type==='half'?.5:0)+(e.overtime?.5:0)}
function entryHas(e,name){return (e.workers||[]).includes(name)}
function workerDayCount(e,name){if(!e||e.type==='rest'||!entryHas(e,name))return 0;let value=Number(e.workerDays?.[name]);return[.5,1,1.5].includes(value)?value:dayCount(e)}
function cleanWorkerDays(e){let base=dayCount(e),clean={};(e.workers||[]).forEach(name=>{let value=Number(e.workerDays?.[name]);if([.5,1,1.5].includes(value)&&value!==base)clean[name]=value});e.workerDays=clean}
function workerDayText(value){return value===.5?'半天':value===1.5?'1.5 天':'整天'}
function settledDates(name){return new Set(meta.settlements.filter(s=>s.workerName===name).flatMap(s=>s.entryDates||[]))}
function workerStats(name){let settled=settledDates(name),cutoff=meta.dayBaselines?.[name]||'',rows=Object.entries(entries).filter(([d,e])=>(!cutoff||d>=cutoff)&&entryHas(e,name)&&!settled.has(d)&&workerDayCount(e,name)>0).sort((a,b)=>b[0].localeCompare(a[0]));return{days:rows.reduce((t,[,e])=>t+workerDayCount(e,name),0),rows}}
function allPeople(){let names=uniq([...activeWorkers().map(x=>x.name),...Object.values(entries).flatMap(e=>e.workers||[]),...meta.settlements.map(s=>s.workerName)]);return names.map(name=>({name,active:!!activeWorkers().find(x=>x.name===name),...workerStats(name)})).sort((a,b)=>(b.active-a.active)||b.days-a.days||a.name.localeCompare(b.name,'zh'))}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
let currentWeek=weekStart(new Date()),selectedPerson=null,draft=null,originalDate=null,settlingPerson=null;
function switchView(id){$$('.tab,.view').forEach(x=>x.classList.remove('on'));$(`.tab[data-view="${id}"]`).classList.add('on');$('#'+id).classList.add('on');$('#fab').style.display=id==='logs'?'block':'none';if(id==='people')renderPeople();if(id==='manage')renderManage()}
$$('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function renderLogs(){let dates=Array.from({length:7},(_,i)=>addDays(currentWeek,i)),today=fmt(new Date());$('#weekLabel').textContent=`${short(dates[0])} 一 — ${short(dates[6])} 日`;$('#dateRange').textContent=`${md(dates[0])} — ${md(dates[6])}`;let total=0;$('#bars').innerHTML=dates.map(d=>{let ds=fmt(d),e=entries[ds],c=dayCount(e);total+=c;let color=e?.type==='half'?'var(--yellow)':e?.type==='rest'?'var(--rest)':'var(--orange)';return `<div class="bar-col ${ds===today?'today-col':''}" data-date="${ds}"><div class="bar"><i style="height:${Math.min(c,1.5)/1.5*100}%;background:${color}"></i></div>${weekday(d)}</div>`}).join('');$('#weekTotal').innerHTML=`${num(total)}<small> 天</small>`;$('#entries').innerHTML=dates.map(renderEntry).join('');}
function renderEntry(d){let ds=fmt(d),e=entries[ds];if(!e)return `<article class="card log" data-date="${ds}"><i class="tick"></i><div class="logbody"><div class="row"><div class="date">${md(d)} <span class="muted">周${weekday(d)}</span></div><span class="badge empty">＋ 添加</span></div><div class="desc muted">今日无记录</div></div></article>`;let type=e.type||'full',label=type==='full'?'整天':type==='half'?'半天':'休息';if(e.overtime)label+=' +0.5';return `<article class="card log" data-date="${ds}"><i class="tick ${type}"></i><div class="logbody"><div class="row"><div class="date">${md(d)} <span class="muted">周${weekday(d)}</span></div><span class="badge ${type}">${label}</span></div>${e.contents?.length?`<div class="desc">${e.contents.map(esc).join(' · ')}</div>`:'<div class="desc muted">未填写工作内容</div>'}${e.workers?.length?`<div class="chips">${e.workers.map(x=>{let personal=workerDayCount(e,x),different=personal!==dayCount(e);return `<span class="chip">${esc(x)}${different?' · '+workerDayText(personal):''}</span>`}).join('')}</div>`:''}${e.purchases?.length?`<div class="expense">${e.purchases.map(p=>`${esc(p.label||'花销')} ¥${Number(p.amount||0).toFixed(2).replace('.00','')}`).join(' · ')}</div>`:''}</div></article>`}
$('#entries').onclick=e=>{let card=e.target.closest('[data-date]');if(card)openEditor(card.dataset.date)};$('#bars').onclick=e=>{let x=e.target.closest('[data-date]');if(x)openEditor(x.dataset.date)};
$('#prevWeek').onclick=()=>{currentWeek=addDays(currentWeek,-7);renderLogs()};$('#nextWeek').onclick=()=>{currentWeek=addDays(currentWeek,7);renderLogs()};$('#todayBtn').onclick=()=>{currentWeek=weekStart(new Date());renderLogs()};$('#fab').onclick=()=>openEditor(fmt(new Date()));
function openEditor(ds){originalDate=ds;let e=entries[ds];draft=e?JSON.parse(JSON.stringify(e)):{type:'full',overtime:false,contents:[],workers:[],workerDays:{},purchases:[]};draft.workerDays=draft.workerDays||{};$('#entryDate').value=ds;$('#editorTitle').textContent=e?'编辑记录':'新增记录';$('#deleteEntry').style.display=e?'block':'none';renderEditor();$('#editor').classList.add('on')}
function close(id){$('#'+id).classList.remove('on')}
$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.backdrop').forEach(x=>x.onclick=e=>{if(e.target===x)close(x.id)});
function renderEditor(){if(draft.type==='rest'){draft.overtime=false;draft.workerDays={}};$$('.type-btn').forEach(b=>b.classList.toggle('on',b.dataset.type===draft.type));$('#overtime').classList.toggle('on',!!draft.overtime);$('#overtime').disabled=draft.type==='rest';let tasks=uniq([...activeTasks().map(x=>x.name),...(draft.contents||[])]),workers=uniq([...activeWorkers().map(x=>x.name),...(draft.workers||[])]);$('#taskChoices').innerHTML=tasks.length?tasks.map(x=>`<button class="choice ${(draft.contents||[]).includes(x)?'on':''}" data-choice="task" data-value="${esc(x)}">${esc(x)}</button>`).join(''):'<span class="muted" style="font-size:12px">请先到“管理”添加工作内容</span>';$('#workerChoices').innerHTML=workers.length?workers.map(x=>`<button class="choice ${(draft.workers||[]).includes(x)?'on':''}" data-choice="worker" data-value="${esc(x)}">${esc(x)}</button>`).join(''):'<span class="muted" style="font-size:12px">请先到“管理”添加工作人员</span>';let selected=draft.workers||[];$('#workerDayRows').innerHTML=draft.type==='rest'?'<span class="muted" style="font-size:12px">休息记录不计算个人天数</span>':selected.length?selected.map(name=>{let current=workerDayCount(draft,name);return `<div class="worker-day-row"><span>${esc(name)}</span><div class="day-pills">${[[.5,'半天'],[1,'整天'],[1.5,'1.5天']].map(([value,label])=>`<button class="day-pill ${current===value?'on':''}" data-worker-day="${value}" data-worker-name="${esc(name)}">${label}</button>`).join('')}</div></div>`}).join(''):'<span class="muted" style="font-size:12px">请先选择工作人员</span>';renderPurchases()}
$('#typeRow').onclick=e=>{let b=e.target.closest('[data-type]');if(b){draft.type=b.dataset.type;if(draft.type==='rest'){draft.overtime=false;draft.workerDays={}}renderEditor()}};$('#overtime').onclick=()=>{if(draft.type==='rest')return;draft.overtime=!draft.overtime;renderEditor()};
$('.sheet').addEventListener('click',e=>{let c=e.target.closest('[data-choice]');if(c){let list=c.dataset.choice==='task'?draft.contents:draft.workers,val=c.dataset.value,i=list.indexOf(val);if(i>=0){list.splice(i,1);if(c.dataset.choice==='worker')delete draft.workerDays[val]}else list.push(val);renderEditor()}let day=e.target.closest('[data-worker-day]');if(day){let name=day.dataset.workerName,value=Number(day.dataset.workerDay);if(value===dayCount(draft))delete draft.workerDays[name];else draft.workerDays[name]=value;renderEditor()}let a=e.target.closest('[data-expense]');if(a){draft.purchases.push({label:a.dataset.expense,amount:0});renderPurchases()}let r=e.target.closest('[data-remove-expense]');if(r){draft.purchases.splice(+r.dataset.removeExpense,1);renderPurchases()}});
function renderPurchases(){$('#purchaseRows').innerHTML=(draft.purchases||[]).map((p,i)=>`<div class="purchase-row" data-purchase="${i}"><input class="p-label" placeholder="名目" value="${esc(p.label||'')}"><input class="p-amount" type="number" inputmode="decimal" min="0" placeholder="金额" value="${p.amount||''}"><button class="remove-expense" data-remove-expense="${i}">×</button></div>`).join('')}
$('#purchaseRows').oninput=e=>{let row=e.target.closest('[data-purchase]'),i=+row.dataset.purchase;if(e.target.classList.contains('p-label'))draft.purchases[i].label=e.target.value;if(e.target.classList.contains('p-amount'))draft.purchases[i].amount=Math.max(0,Number(e.target.value)||0)};
$('#saveEntry').onclick=()=>{let newDate=$('#entryDate').value;if(!newDate){toast('请选择日期');return}if(newDate!==originalDate&&entries[newDate]){toast('目标日期已有记录，请先编辑或删除该记录');return}draft.contents=uniq(draft.contents||[]);draft.workers=uniq(draft.workers||[]);cleanWorkerDays(draft);draft.purchases=(draft.purchases||[]).filter(p=>p.label||p.amount);let backup=JSON.stringify(entries);if(newDate!==originalDate)delete entries[originalDate];entries[newDate]=draft;if(!persist()){entries=JSON.parse(backup);return}close('editor');currentWeek=weekStart(parse(newDate));renderLogs();renderPeople();toast('记录已保存')};
$('#deleteEntry').onclick=()=>{if(confirm('确定删除这一天的记录吗？历史工资结算记录不会被删除。')){let old=entries[originalDate];delete entries[originalDate];if(!persist()){entries[originalDate]=old;return}close('editor');renderLogs();renderPeople();toast('记录已删除')}};
function lastSettlement(name){return meta.settlements.filter(s=>s.workerName===name).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0]}
function settlementThrough(s){return s?.settledThrough||s?.periodEnd||''}
function settlementLabel(s){let through=settlementThrough(s);return through?'结算到 '+md(parse(through)):s?'结算于 '+new Date(s.createdAt).toLocaleDateString('zh-CN'):''}
function renderPeople(){let list=allPeople();if(!selectedPerson||!list.find(x=>x.name===selectedPerson))selectedPerson=list[0]?.name||null;$('#peopleGrid').innerHTML=list.length?list.map(p=>{let last=lastSettlement(p.name),paid=p.active?(last?'上次'+settlementLabel(last):'尚未结算'):'已从人员库删除';return `<div class="card person ${p.name===selectedPerson?'selected':''} ${p.active?'':'archived'}" data-person="${esc(p.name)}"><div class="row"><b>${esc(p.name)}</b><span style="color:var(--orange)">›</span></div><div class="num">${num(p.days)} <span>天</span></div><div class="paid">${paid}</div></div>`}).join(''):'<div class="empty-state" style="grid-column:1/-1">还没有工作人员，请先到“管理”添加。</div>';renderPersonDetail()}
$('#peopleGrid').onclick=e=>{let p=e.target.closest('[data-person]');if(p){selectedPerson=p.dataset.person;renderPeople()}};
function renderPersonDetail(){if(!selectedPerson){$('#personDetail').innerHTML='';return}let s=workerStats(selectedPerson),history=meta.settlements.filter(x=>x.workerName===selectedPerson).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),last=history[0],lastText=last?(settlementThrough(last)?settlementLabel(last)+'，之后累计':'自 '+new Date(last.createdAt).toLocaleDateString('zh-CN')+' 上次结算后累计'):'尚未结算';$('#personDetail').innerHTML=`<div class="panel detail"><div class="row"><h3>${esc(selectedPerson)}</h3><span class="badge full">未结算</span></div><div class="big">${num(s.days)} <span>天</span></div><div class="muted" style="font-size:12px;margin-bottom:14px">${lastText}</div>${s.rows.slice(0,6).map(([d,e])=>`<div class="detail-line"><span>${md(parse(d))} · ${(e.contents||[]).map(esc).join('、')||'工作记录'}</span><b>${num(workerDayCount(e,selectedPerson))} 天</b></div>`).join('')||'<div class="empty-state">当前没有未结算工作天数</div>'}<div class="actions"><button class="btn primary" id="settleBtn" ${s.days<=0?'disabled':''}>选择日期结算工资</button></div><div class="history"><div class="label" style="margin-left:0">历史结算</div>${history.length?history.map(x=>{let range=x.periodStart||'';if(x.periodEnd&&x.periodEnd!==x.periodStart)range+=' — '+x.periodEnd;return `<div class="history-item"><span>${settlementLabel(x)}<br><span class="muted">${range}</span></span><b>${num(x.days)} 天 · 已结清</b></div>`}).join(''):'<div class="empty-state">暂无结算记录</div>'}</div></div>`;let b=$('#settleBtn');if(b)b.onclick=()=>openSettle()}
function settlementStats(name,cutoff){let all=workerStats(name),rows=cutoff?all.rows.filter(([d])=>d<=cutoff):all.rows;return{days:rows.reduce((t,[,e])=>t+workerDayCount(e,name),0),rows,allDays:all.days}}
function renderSettlePreview(){let cutoff=$('#settleDate').value,s=settlementStats(settlingPerson,cutoff),dates=s.rows.map(x=>x[0]).sort(),remaining=Math.max(0,s.allDays-s.days);$('#settleDays').textContent=num(s.days)+' 天';$('#settleRange').textContent=dates.length?`${md(parse(dates[0]))} — ${md(parse(dates[dates.length-1]))} · ${dates.length} 条出勤记录`:'所选日期前没有可结算的工作记录';$('#settleRemaining').textContent=remaining>0?`结算后仍保留 ${num(remaining)} 天未结算`:'结算后当前未结算天数为 0';$('#confirmSettle').disabled=!cutoff||s.days<=0}
function openSettle(){let s=workerStats(selectedPerson);if(s.days<=0)return;let dates=s.rows.map(x=>x[0]).sort();settlingPerson=selectedPerson;$('#settleName').textContent=selectedPerson;$('#settleDate').min=dates[0];$('#settleDate').max=dates[dates.length-1];$('#settleDate').value=dates[dates.length-1];renderSettlePreview();$('#settleDialog').classList.add('on')}
$('#settleDate').oninput=renderSettlePreview;$('#settleDate').onchange=renderSettlePreview;
$('#confirmSettle').onclick=()=>{let cutoff=$('#settleDate').value,s=settlementStats(settlingPerson,cutoff),dates=s.rows.map(x=>x[0]).sort();if(!cutoff){toast('请选择结算截止日期');return}if(s.days<=0){toast('所选日期前没有可结算的工作记录');return}meta.settlements.push({id:'s_'+Date.now(),workerName:settlingPerson,days:s.days,entryDates:dates,periodStart:dates[0]||'',periodEnd:dates[dates.length-1]||'',settledThrough:cutoff,createdAt:now()});if(!persist()){meta.settlements.pop();return}close('settleDialog');renderPeople();let remaining=workerStats(settlingPerson).days;toast(`已结清到 ${md(parse(cutoff))}${remaining>0?'，剩余 '+num(remaining)+' 天':'，未结算已归零'}`)};
function renderManage(){let w=activeWorkers(),t=activeTasks();$('#workerCount').textContent=w.length+' / 12';$('#taskCount').textContent=t.length+' / 12';$('#workerLimit').classList.toggle('show',w.length>=12);$('#taskLimit').classList.toggle('show',t.length>=12);$('#workerList').innerHTML=w.length?w.map(x=>`<div class="manage-item"><span>${esc(x.name)}</span><button class="del" data-delete="worker" data-name="${esc(x.name)}">×</button></div>`).join(''):'<div class="empty-state">暂无工作人员</div>';$('#taskList').innerHTML=t.length?t.map(x=>`<div class="manage-item"><span>${esc(x.name)}</span><button class="del" data-delete="task" data-name="${esc(x.name)}">×</button></div>`).join(''):'<div class="empty-state">暂无工作内容</div>';$('#migrationNotice').innerHTML=migrated?'<div class="notice">已兼容读取原版工作日志，并从历史记录中整理出人员与工作内容。旧日志保持不变。</div>':''}
function addLibrary(type){let arr=type==='worker'?activeWorkers():activeTasks(),input=$('#'+type+'Input'),value=input.value.trim(),label=type==='worker'?'工作人员':'工作内容';if(!value)return;if(arr.length>=12){$('#'+type+'Limit').classList.add('show');toast(label+'已达到 12 项上限');return}let all=type==='worker'?meta.workers:meta.tasks,existing=all.find(x=>x.name===value);if(existing){if(existing.active===false){existing.active=true;input.value='';persist();renderManage();renderPeople();toast('已恢复 '+value)}else toast(value+' 已经存在');return}all.push({name:value,active:true,createdAt:now()});input.value='';persist();renderManage();renderPeople();toast('已添加 '+value)}
$$('[data-add]').forEach(b=>b.onclick=()=>addLibrary(b.dataset.add));$('#workerInput').onkeydown=e=>{if(e.key==='Enter')addLibrary('worker')};$('#taskInput').onkeydown=e=>{if(e.key==='Enter')addLibrary('task')};
$('#manage').onclick=e=>{let b=e.target.closest('[data-delete]');if(!b)return;let type=b.dataset.delete,name=b.dataset.name,label=type==='worker'?'工作人员':'工作内容';if(confirm(`确认删除${label}“${name}”？历史工作记录和结算记录会继续保留。`)){let item=(type==='worker'?meta.workers:meta.tasks).find(x=>x.name===name);if(item)item.active=false;persist();renderManage();renderPeople();toast('已从'+label+'库删除')}};
renderLogs();renderPeople();renderManage();
if(storageError)toast('浏览器存储不可用，请勿录入并检查手机浏览器设置');
else if(baselineAdjusted)toast('天数已校正：我 6 天，长征 5 天');
else if(photoImported||photoSkipped)toast(`照片记录已同步：新增 ${photoImported} 天${photoSkipped?'，保留已有 '+photoSkipped+' 天':''}`);
})();
</script></body></html>
